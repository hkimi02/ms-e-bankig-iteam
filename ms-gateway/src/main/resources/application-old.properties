spring.application.name=ms-gateway
server.port=8888

# discovery (Eureka) enabled: the gateway reads the registry to build its routes
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# dynamic routes use the service id in lower case: /ms-customer/** instead of /MS-CUSTOMER/**
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# actuator (/actuator/gateway/routes lists the routes created from Eureka)
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted
