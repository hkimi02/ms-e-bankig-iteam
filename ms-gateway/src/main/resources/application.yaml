spring:
  application:
    name: ms-gateway
  cloud:
    # discovery (Eureka) enabled: the gateway reads the registry to build its routes
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # dynamic routes use the service id in lower case: /ms-customer/** instead of /MS-CUSTOMER/**
              lower-case-service-id: true

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# actuator (/actuator/gateway/routes lists the routes created from Eureka)
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted
