# docker compose up --build -d   ->  Eureka on 8761, gateway on 8888
services:
  ms-discovery:
    build: ./ms-discovery
    container_name: ms-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8761'"]
      interval: 5s
      retries: 30

  ms-config:
    build: ./ms-config
    container_name: ms-config
    ports:
      - "8999:8999"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-discovery:8761/eureka/
    depends_on:
      ms-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8999'"]
      interval: 5s
      retries: 30

  ms-customer:
    build: ./ms-customer
    container_name: ms-customer
    restart: on-failure
    ports:
      - "8001:8000"   # 8000 inside the container; host port 8001 (8000 is often busy on the host)
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-discovery:8761/eureka/
      # same as ms-account: config server reached by its service name, required in Docker
      SPRING_CONFIG_IMPORT: configserver:http://ms-config:8999
    depends_on:
      ms-discovery:
        condition: service_healthy
      ms-config:
        condition: service_healthy

  ms-account:
    build: ./ms-account
    container_name: ms-account
    restart: on-failure
    ports:
      - "8100:8100"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-discovery:8761/eureka/
      # inside Docker the config server is reached by its service name, not localhost.
      # Not optional: if ms-config is not ready yet, ms-account fails and is restarted (see restart below)
      SPRING_CONFIG_IMPORT: configserver:http://ms-config:8999
    depends_on:
      ms-discovery:
        condition: service_healthy
      ms-config:
        condition: service_healthy

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-discovery:8761/eureka/
    depends_on:
      ms-discovery:
        condition: service_healthy
