spring:
  application:
    name: ms-discovery

server:
  port: 8761

eureka:
  client:
    # do not fetch the registry from yourself
    fetch-registry: false
    # do not register yourself
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
