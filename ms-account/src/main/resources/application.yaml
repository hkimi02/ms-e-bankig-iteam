spring:
  application:
    name: ms-account
  # configuration read from the config server (ms-config), profile prod -> ms-account-prod.yaml
  config:
    import: "optional:configserver:http://localhost:8999"
  profiles:
    active: "prod"

  datasource:
    url: jdbc:h2:mem:accountsdb
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true

  cloud:
    discovery:
      enabled: true

server:
  port: 8100

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# local fallback values, used when ms-config is not reachable (the config server overrides them)
build:
  version: "0.0.0-local"
accounts:
  message: "Welcome to DigitBank accounts APIs (local fallback)"
  contactDetails:
    name: "Amine hkimi"
    email: "hkimiamin02@gmail.com"
  onCallSupport:
    - (216) 97 653 312
