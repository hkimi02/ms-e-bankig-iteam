spring:
  application:
    name: ms-customer
  config:
    import: "optional:configserver:http://localhost:8999"
  profiles:
    active: "prod"
  # params for database
  datasource:
    url: jdbc:h2:mem:customerdb
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none          # the table is created by schema.sql, Hibernate must not recreate it
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

  # discovery (Eureka) enabled; configuration read from the config server (ms-config), profile prod
  cloud:
    discovery:
      enabled: true

server:
  port: 8000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# local fallback values, used when ms-config is not reachable (the config server overrides them)
build:
  version: "0.0.0-local"
customers:
  message: "Welcome to DigitBank customers APIs (local fallback)"
  contactDetails:
    name: "Amine hkimi"
    email: "hkimiamin02@gmail.com"
  onCallSupport:
    - (216) 97 653 312
